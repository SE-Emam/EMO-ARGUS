<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARGUS — Field Companion</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <h1>ARGUS — Field Companion</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">Checking local bridge…</span></div>

  <label for="token">Local bridge token (X-Argus-Token)</label>
  <input id="token" type="password" placeholder="Paste it from the argus-bridge terminal" autocomplete="off" />
  <div class="hint">Stored on this machine only. It never leaves the browser except toward 127.0.0.1.</div>

  <label for="port">Bridge port</label>
  <input id="port" type="number" min="1" max="65535" value="8765" placeholder="8765" />
  <div class="hint">Default 8765. Change if your bridge runs on a different port.</div>

  <label for="snippet">Snippet for quick audit</label>
  <textarea id="snippet" placeholder="Paste a paragraph or a URL from the page…"></textarea>
  <button id="verifyBtn">Verify Snippet</button>
  <button id="refreshBtn">Check connection</button>

  <label>Result</label>
  <pre id="result">—</pre>

  <div class="log">
    <label>Captured context (ephemeral — cleared with the session)</label>
    <div id="log"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
