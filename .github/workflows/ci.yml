name: ARGUS CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  argus-security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pip-audit
          pip install -e .

      - name: Repo Hygiene Gate (visitor-clean)
        run: python scripts/check_hygiene.py

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Run Tests
        run: pytest tests/ -v

      - name: Audit dependencies
        run: pip-audit --strict

      - name: Verify Offline Reports (Sanity Check)
        run: |
          if ls output/*.md >/dev/null 2>&1; then
            argus verify --offline output/*.md || true
          else
            echo "no reports to verify (output/ empty) — skipping"
          fi
