[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emo-argus"
version = "1.2.1"
description = "ARGUS - turn shallow AI answers into verified, multilingual research reports (CLI + MCP server, zero dependencies)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["research", "osint", "verification", "multilingual", "cli", "mcp", "ai-agents"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
argus = "emo_argus.search:main"
argus-lite = "emo_argus.search:lite_main"
argus-mcp = "emo_argus.mcp:main"
argus-bridge = "emo_argus.bridge:main"

[project.urls]
Homepage = "https://github.com/SE-Emam/EMO-ARGUS"
Documentation = "https://github.com/SE-Emam/EMO-ARGUS#readme"
Repository = "https://github.com/SE-Emam/EMO-ARGUS.git"
Changelog = "https://github.com/SE-Emam/EMO-ARGUS/blob/main/docs/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emo_argus = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
